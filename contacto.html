<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODA DANILOVICH - INICIO</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>

    <header>
        <img class="logo" src="images/logo.png" alt="Logo MD">

        <h1>MODA DANILOVICH</h1>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="producto.html">Productos</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main>
        <section class="seccion-contacto">
            <div class="caja">
                <h2>Contacta con nosotros</h2>

                <label>Nombre</label>
                <input type="text" id="nombre">

                <label>Correo electrónico</label>
                <input type="text" id="correo">

                <label>Mensaje</label>
                <textarea id="mensaje" rows="5"></textarea>

                <button type="button" onclick="comprobarFormulario()">Enviar</button>

                <p id="texto"></p>
            </div>
            
        </section>
        
    </main>

    <footer>
        <p>© 2026 Moda DANILOVICH</p>
    </footer>
    

<script>
    function comprobarFormulario() {
        var nombre = document.getElementById("nombre").value;
        var correo = document.getElementById("correo").value;
        var mensaje = document.getElementById("mensaje").value;
        var texto = document.getElementById("texto");

        if (nombre == "" || correo == "" || mensaje == "") {
        texto.innerHTML = "Por favor, rellena todos los campos";
        texto.style.color = "red";
    } else if (!correo.includes("@") || !correo.includes(".")) {
        texto.innerHTML = "Introduce un correo válido";
        texto.style.color = "red";
    } else {
        texto.innerHTML = "Formulario enviado correctamente";
        texto.style.color = "green";
    }
}
</script>

</body>
</html>

</body>
</html>
